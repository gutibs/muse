# HTTP — ACME challenge + redirect
server {
	listen 80;
	server_name lovemuse.app www.lovemuse.app;

	location /.well-known/acme-challenge/ {
		root /var/www/certbot;
	}

	location / {
		return 301 https://$host$request_uri;
	}
}

# HTTPS — API only
server {
	listen 443 ssl;
	server_name lovemuse.app www.lovemuse.app;

	ssl_certificate /etc/letsencrypt/live/lovemuse.app/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/lovemuse.app/privkey.pem;

	location /api/ {
		proxy_pass http://backend:8000;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}

	location /admin/ {
		proxy_pass http://backend:8000;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}

	location /static/ {
		alias /usr/share/nginx/static/;
	}

	# Uploads (avatares, y más adelante las fotos de Places cacheadas). Sale del
	# volumen nombrado `muse_media`, montado read-only. Esta location no existía:
	# MEDIA_ROOT sólo se sirve con DEBUG (config/urls.py), así que en producción
	# los avatares daban 404 aunque el archivo existiera.
	location /media/ {
		alias /usr/share/nginx/media/;
		expires 30d;
		add_header Cache-Control "public, max-age=2592000" always;
		try_files $uri =404;
	}

	# Legacy: emails enviados antes del 2026-05-09 apuntan a /register.
	# Mantener un 301 → / hasta que esos invites expiren.
	location = /register {
		return 301 /;
	}

	location = / {
		root /usr/share/nginx/landing;
		try_files /index.html =404;
		add_header Cache-Control "no-cache, must-revalidate" always;
	}

	location ~* ^/(logo\.png|qr-android\.png|legal\.css|i18n\.js)$ {
		root /usr/share/nginx/landing;
		expires 1d;
		add_header Cache-Control "public, max-age=86400" always;
		try_files $uri =404;
	}

	# Legal pages — served from the landing bundle. This is the single published
	# source: the app links here instead of carrying its own copy of the texts
	# (see app/src/lib/legal.ts). `privacy.html` is the entry point the app and
	# the store listings point at; it routes to GDPR or PDPO by jurisdiction.
	location ~* ^/(privacy|pdpo|gdpr|terms|community|cookies|contact)\.html$ {
		root /usr/share/nginx/landing;
		add_header Cache-Control "public, max-age=3600" always;
		try_files $uri =404;
	}

	# Public shared lists — the real SvelteKit screen, not a second copy of it.
	# Hasta acá era `landing/shared.html`, 318 líneas de HTML+JS a mano que
	# reimplementaban la misma pantalla que ya existe en `app/src/routes/shared/`
	# y que quedaban atrás en cada cambio de la app.
	#
	# Sirve el index.html de la SPA y el router del cliente resuelve la ruta;
	# el token sale del path. Es la ÚNICA ruta de la app expuesta por web: no hay
	# `try_files $uri /index.html` general, así que /feed, /login y compañía
	# siguen cayendo en el 404 de abajo. Si mañana se publican /u/ o /vote/,
	# cada una lleva su propio location como éste.
	location ~* "^/shared/[0-9a-fA-F-]{8,}/?$" {
		root /usr/share/nginx/app;
		add_header Cache-Control "no-cache, must-revalidate" always;
		try_files /index.html =404;
	}

	# Bundle de la SPA. Nombres con hash de contenido, así que se puede cachear
	# para siempre: un deploy cambia el nombre del archivo, no su contenido.
	location /_app/ {
		alias /usr/share/nginx/app/_app/;
		expires 1y;
		add_header Cache-Control "public, max-age=31536000, immutable" always;
		try_files $uri =404;
	}

	location = /favicon.svg {
		root /usr/share/nginx/app;
		expires 1d;
		add_header Cache-Control "public, max-age=86400" always;
		try_files $uri =404;
	}

	location / {
		return 404;
	}
}
