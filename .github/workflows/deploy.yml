name: Deploy

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'nginx/default-aws.conf'
      - 'nginx/Dockerfile.aws'
      - 'nginx/landing/**'
      - 'docker-compose.aws.yml'
      # El cron de mantenimiento se instala en cada deploy desde este
      # archivo. Sin esta ruta, agregarle una tarea no llega al servidor
      # hasta que alguien toque otra cosa por casualidad.
      - 'deploy/**'
      - '.github/workflows/deploy.yml'
      # La imagen de nginx ahora compila la SPA para servir /shared/<token>.
      # Sin estas rutas, un cambio en la pantalla compartida no llegaba nunca a
      # producción. Deliberadamente NO están `app/android/` ni `app/ios/`: cambian
      # en cada release de APK y no tocan nada de lo que se sirve por web.
      - 'app/src/**'
      - 'app/static/**'
      - 'app/package.json'
      - 'app/package-lock.json'
      - 'app/svelte.config.js'
      - 'app/vite.config.ts'
      - '.dockerignore'
      - '.github/workflows/test.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          # Default is 10m. Un build sin cache (gdal + pip desde cero) tarda
          # más: el 2026-08-04 la sesión se cortó en el paso 7/11 y el job
          # quedó en rojo aunque el build después terminó bien en el server.
          command_timeout: 30m
          script: |
            set -e
            cd /home/ubuntu/muse
            git pull origin main

            # Build ANTES de tocar lo que está corriendo. Con `set -e`, un build
            # fallido corta acá y el sitio sigue sirviendo la versión anterior:
            # el deploy queda en rojo, producción intacta.
            # Antes esto vivía en un `up --build` posterior al `down`, así que
            # cualquier tropiezo del build (disco lleno, timeout de SSH, un
            # typo en el Dockerfile) dejaba el sitio caído hasta que alguien
            # entrara a mano. Pasó dos veces el 2026-08-04.
            sudo docker-compose -f docker-compose.aws.yml build

            # Backup lógico de la DB de PRODUCCIÓN (RDS) antes de cualquier restart.
            # Guarda los últimos 14 dumps en el volumen muse_pgbackups. El contenedor
            # `db` se usa solo como cliente pg_dump con red hacia RDS; la app habla con
            # RDS directo (DB_HOST en el .env). Complementa los backups automáticos de RDS.
            # El bloque es best-effort (|| true): si falla, el deploy sigue.
            if sudo docker-compose -f docker-compose.aws.yml ps -q db | grep -q .; then
              TS=$(date -u +%Y%m%d-%H%M%S)
              RDS_HOST=$(grep -E '^[[:space:]]*DB_HOST=' .env | tail -1 | cut -d= -f2 | tr -d ' ')
              RDS_USER=$(grep -E '^[[:space:]]*DB_USER=' .env | tail -1 | cut -d= -f2 | tr -d ' ')
              RDS_NAME=$(grep -E '^[[:space:]]*DB_NAME=' .env | tail -1 | cut -d= -f2 | tr -d ' ')
              RDS_PASS=$(grep -E '^[[:space:]]*DB_PASSWORD=' .env | tail -1 | cut -d= -f2-)
              sudo docker-compose -f docker-compose.aws.yml exec -T -e PGPASSWORD="$RDS_PASS" db \
                sh -c "pg_dump -h '$RDS_HOST' -U '$RDS_USER' '$RDS_NAME' | gzip > /backups/muse-$TS.sql.gz" || true
              sudo docker-compose -f docker-compose.aws.yml exec -T db \
                sh -c 'ls -1t /backups/muse-*.sql.gz 2>/dev/null | tail -n +15 | xargs -r rm -f' || true
            fi

            # Bring everything down first (NEVER pass -v: that would delete the named volume).
            # docker-compose v1.29.2 has a recreate bug (KeyError: ContainerConfig) so we force
            # a clean down before up.
            sudo docker-compose -f docker-compose.aws.yml down --remove-orphans

            # Sin --build: la imagen ya se construyó arriba. La ventana de
            # indisponibilidad es sólo este down/up, no el build entero.
            sudo docker-compose -f docker-compose.aws.yml up -d

            # Wait for db healthcheck before migrating
            for i in $(seq 1 30); do
              if sudo docker-compose -f docker-compose.aws.yml exec -T db sh -c 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"' 2>/dev/null; then
                break
              fi
              sleep 2
            done

            # NO migrar acá: el CMD de backend/Dockerfile.prod ya corre
            # `migrate --fake-initial && gunicorn`, así que este paso lanzaba un
            # segundo migrate en paralelo con el del contenedor. Mientras las
            # migraciones eran instantáneas no se notaba; la primera que creó
            # tablas nuevas (places.0001_initial) tardó lo suficiente para que
            # los dos procesos se pisaran y el deploy muriera con
            # `duplicate key ... places_placedetailscache_id_seq already exists`
            # (2026-08-19), con la base ya migrada por el otro proceso.
            #
            # El migrate del contenedor es el que manda: si falla, gunicorn no
            # arranca, el health check de abajo no ve el 401 y el deploy queda
            # en rojo igual. Además cubre los reinicios del contenedor, que
            # este paso no veía.

            # Post-deploy health check.
            # `up -d` returns success the moment containers are created, even if
            # nginx aborts seconds later with a bad-config crash loop (vivido el
            # 2026-05-23 con `{8,}` sin comillar en una regex). Probamos el
            # endpoint público hasta que devuelva 401 (el código esperado de
            # /api/v1/ con DRF IsAuthenticated). Si en ~40s no sale, el deploy
            # queda en rojo y dumpamos logs para diagnóstico.
            echo "=== Health check ==="
            sleep 5
            OK=0
            for i in $(seq 1 12); do
              STATE=$(sudo docker-compose -f docker-compose.aws.yml ps nginx 2>&1)
              if echo "$STATE" | grep -qE "Restarting|Exit"; then
                echo "nginx not Up (attempt $i):"
                echo "$STATE"
                break
              fi
              CODE=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 10 -k \
                --resolve lovemuse.app:443:127.0.0.1 \
                https://lovemuse.app/api/v1/ || echo "000")
              if [ "$CODE" = "401" ]; then
                echo "Health check OK (HTTP 401 on attempt $i)"
                OK=1
                break
              fi
              echo "Attempt $i: HTTP $CODE — retrying in 3s"
              sleep 3
            done
            if [ "$OK" != "1" ]; then
              echo "=== Deploy health check FAILED ==="
              sudo docker-compose -f docker-compose.aws.yml ps
              echo "--- nginx logs ---"
              sudo docker-compose -f docker-compose.aws.yml logs --tail=40 nginx
              echo "--- backend logs ---"
              sudo docker-compose -f docker-compose.aws.yml logs --tail=20 backend
              exit 1
            fi

            # Cron de mantenimiento. Se reinstala en cada deploy para que el
            # archivo del repo sea la única fuente: si alguien lo edita a mano
            # en el server, el próximo deploy lo pisa. `install` es idempotente
            # y deja dueño y permisos que cron exige (root:root 644); un
            # archivo con otros permisos lo ignora en silencio.
            sudo install -m 644 -o root -g root \
              deploy/cron/muse-maintenance /etc/cron.d/muse-maintenance

            # Recolección de imágenes viejas, sólo con el deploy ya sano.
            # El filtro `until` es lo importante: `prune -af` a secas se lleva
            # las capas intermedias sin tag de las que depende el cache del
            # builder clásico (docker-compose v1 no usa BuildKit), y el
            # siguiente build arranca de cero. Con 720h se van sólo las
            # imágenes realmente viejas y el cache reciente sobrevive.
            # Sin esto el disco se llenó: 28 imágenes, 3 en uso (2026-08-04).
            sudo docker image prune -af --filter "until=720h" || true
