repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: check-no-silent-excepts
        name: check no silent excepts
        entry: python3 backend/scripts/check_no_silent_excepts.py
        language: system
        types: [python]
        files: ^backend/

      - id: check-policy-versions
        name: check policy versions match the published texts
        entry: python3 backend/scripts/check_policy_versions.py
        language: system
        pass_filenames: false
        files: ^(backend/accounts/services/consent\.py|nginx/landing/(gdpr|pdpo|terms)\.html)$

      - id: check-no-voseo
        name: el espanol de Muse no vosea
        entry: python3 backend/scripts/check_no_voseo.py
        language: system
        pass_filenames: false
        files: ^(app/src/lib/i18n/translations\.ts|backend/locale/es/LC_MESSAGES/django\.po|nginx/landing/.*\.html)$

      - id: check-no-console-log-in-source
        name: check no console.log in app/src
        entry: bash backend/scripts/check_no_console_log.sh
        language: system
        types_or: [javascript, ts, svelte]
        files: ^app/src/
