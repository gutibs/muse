services:
  # TEMPORAL: la app migró a RDS (el backend entra por DB_HOST del .env). Este
  # contenedor queda solo como (a) fallback de datos y (b) cliente pg_dump para
  # los backups lógicos de RDS (ver deploy.yml). Eliminar una vez RDS esté
  # probado en prod unos días.
  db:
    image: postgis/postgis:16-3.4
    container_name: muse_db
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - muse_pgdata:/var/lib/postgresql/data
      - muse_pgbackups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    env_file:
      - ./.env
    # DB_HOST/DB_PORT salen del .env (apuntan a RDS). NO agregar acá un
    # `environment: DB_HOST: db`: pisaría el .env y mandaría el backend a la DB
    # local del contenedor en lugar de a RDS (fue el bug de la migración).
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile.aws
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  muse_pgdata:
  muse_pgbackups:
