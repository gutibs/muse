[pytest]
DJANGO_SETTINGS_MODULE = config.settings
python_files = test_*.py
# Sin --reuse-db, y no es un olvido: reusar la base daba 23 fallos fantasma.
#
# `test_from_google_race` y `test_password_reset_confirm` necesitan hilos de
# verdad, o sea `django_db(transaction=True)`, y Django trunca todas las tablas
# al terminar uno de esos. El truncate no distingue las filas que sembraron las
# data migrations: medido, `restaurants_tag` pasa de 27 a 0. Con la base reusada
# esa base mutilada es la que encuentra la corrida siguiente, y fallan 23 tests
# de tags, dietary y district que no tienen nada que ver con lo que se cambió.
#
# `serialized_rollback=True` no lo arregla: restaura los datos al *empezar* un
# test transaccional, no los repone al terminar.
#
# Crear la base cuesta 10-20 segundos sobre 100, y en CI cero porque allá es
# nueva siempre. Ese es el precio de que un rojo signifique algo.
addopts = --strict-markers
markers =
	critical: superficies que tocan auth, permisos, plata, integraciones
	slow: tests >1s
	integration: pegan a servicios externos de verdad (Google Places). Se saltean
		solos sin GOOGLE_PLACES_API_KEY, así que CI sigue verde sin credenciales.
		Correrlos a mano con: pytest -m integration
